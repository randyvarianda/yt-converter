<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Converter</title>
<style>
@font-face { font-family: Lato; src: url(fonts/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(fonts/Lato-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Lato; src: url(fonts/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Seg; src: url(fonts/DSEG7Classic-Bold.woff2) format("woff2"); font-weight: 700; }

:root {
  color-scheme: light;
  --desk: #c9ccd1;
  --desk-light: #dfe1e4;
  --plate-hi: #f3f4f5;
  --plate-lo: #d9dbde;
  --plate-edge: rgb(0 0 0 / .38);
  --plate-shine: rgb(255 255 255 / .9);
  --hairline: rgb(0 0 0 / .022);
  --well: rgb(0 0 0 / .10);
  --bezel-lo: rgb(255 255 255 / .35);
  --sheen: rgb(255 255 255 / .45);
  --engrave: #383b40;
  --engrave-soft: #555961;
  --engrave-hi: rgb(255 255 255 / .85);
  --key-top: #ffffff;
  --key-bot: #e4e5e8;
  --key-down-top: #eceef0;
  --key-down-bot: #dcdee1;
  --key-text: #1c1e21;
  --key-edge: rgb(0 0 0 / .32);
  --key-shine: rgb(255 255 255 / 1);
  --key-drop: rgb(30 34 40 / .38);
  --led-off: #9a9ea5;
  --led-on: #2f86ff;
  --led-glow: rgb(47 134 255 / .65);
  --led-ok: #2bd47d;
  --led-ok-glow: rgb(43 212 125 / .6);
  --glass: #060b0d;
  --glass-edge: #000;
  --vfd: #a6e6ff;
  --vfd-dim: rgb(166 230 255 / .62);
  --vfd-ghost: rgb(166 230 255 / .07);
  --vfd-warn: #ffbb55;
  --focus: #2f86ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --desk: #0c0d0f;
    --desk-light: #1a1c1f;
    --plate-hi: #34363a;
    --plate-lo: #25272a;
    --plate-edge: rgb(0 0 0 / .8);
    --plate-shine: rgb(255 255 255 / .14);
    --hairline: rgb(255 255 255 / .018);
    --well: rgb(0 0 0 / .32);
    --bezel-lo: rgb(255 255 255 / .06);
    --sheen: rgb(255 255 255 / .035);
    --engrave: #c6c9ce;
    --engrave-soft: #a2a6ad;
    --engrave-hi: rgb(0 0 0 / .7);
    --key-top: #4a4c51;
    --key-bot: #36383c;
    --key-down-top: #3a3c40;
    --key-down-bot: #2f3134;
    --key-text: #eef0f3;
    --key-edge: rgb(0 0 0 / .75);
    --key-shine: rgb(255 255 255 / .16);
    --key-drop: rgb(0 0 0 / .7);
    --led-off: #55585e;
  }
}

* { box-sizing: border-box; }
html { background: var(--desk); }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 80% at 50% 0%, var(--desk-light), var(--desk) 70%);
  color: var(--engrave);
  font: 400 14px/1.4 Lato, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: grid;
  place-items: center;
  padding: 40px 16px;
}
::selection { background: var(--led-on); color: #fff; }
.icon {
  display: inline-block; flex: none;
  width: var(--icon, 16px); height: var(--icon, 16px);
  background: currentColor;
  -webkit-mask: var(--src) center / contain no-repeat;
  mask: var(--src) center / contain no-repeat;
}
.i-download { --src: url(icons/download.svg); }
.i-x        { --src: url(icons/x.svg); }
.i-eject    { --src: url(icons/eject.svg); }
.i-alert    { --src: url(icons/alert.svg); }

.rack { width: 100%; max-width: 920px; }

/* ---------- Faceplate ---------- */
.unit {
  position: relative;
  border-radius: 14px;
  padding: 18px 22px 22px;
  background:
    linear-gradient(175deg, transparent 30%, var(--sheen) 46%, transparent 62%),
    repeating-linear-gradient(0deg, var(--hairline) 0 1px, transparent 1px 2px, var(--hairline) 2px 3px, transparent 3px 5px),
    linear-gradient(180deg, var(--plate-hi), var(--plate-lo));
  box-shadow:
    inset 0 1px 0 var(--plate-shine),
    inset 0 -1px 0 rgb(0 0 0 / .12),
    0 0 0 1px var(--plate-edge),
    0 2px 3px rgb(0 0 0 / .18),
    0 22px 40px -18px rgb(0 0 0 / .45);
}
.legend, .top {
  text-transform: uppercase;
  letter-spacing: .14em;
  font-weight: 700;
  font-size: 11px;
  color: var(--engrave);
  text-shadow: 0 1px 0 var(--engrave-hi);
}
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.top .brand { font-size: 12px; letter-spacing: .2em; }
.top .model { color: var(--engrave-soft); font-weight: 600; margin-left: auto; }
.led {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--led-off);
  box-shadow: inset 0 1px 1px rgb(0 0 0 / .45), 0 1px 0 var(--engrave-hi);
}
.led.on, [aria-pressed="true"] > .led, [aria-checked="true"] > .led {
  background: radial-gradient(circle at 40% 35%, #cfe3ff, var(--led-on) 55%);
  box-shadow: 0 0 0 1px rgb(0 40 120 / .35), 0 0 8px 1px var(--led-glow);
}

.deck { display: grid; grid-template-columns: minmax(0, 1fr) 168px; gap: 18px; }
.window { min-width: 0; }

/* ---------- Display window ---------- */
.window {
  border-radius: 9px;
  padding: 4px;
  background: linear-gradient(180deg, rgb(0 0 0 / .22), var(--bezel-lo));
  box-shadow: inset 0 1px 2px rgb(0 0 0 / .35);
}
.vfd {
  position: relative;
  min-height: 236px;
  border-radius: 6px;
  padding: 14px 16px 16px;
  background:
    radial-gradient(140% 90% at 30% 0%, rgb(166 230 255 / .06), transparent 60%),
    var(--glass);
  box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 8px 24px rgb(0 0 0 / .8);
  color: var(--vfd);
  overflow: hidden;
  display: flex; flex-direction: column; gap: 12px;
}
.vfd::after { /* glass reflection */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(160deg, rgb(255 255 255 / .07), transparent 38%);
}
.glow { text-shadow: 0 0 4px rgb(166 230 255 / .35); }
.vfd-small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vfd-dim); font-weight: 700; }

.link-row {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgb(166 230 255 / .16);
}
.link-row label { flex: none; }
.link-row input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: none;
  color: var(--vfd);
  font: 600 15px/1.3 Lato, sans-serif;
  caret-color: var(--vfd);
  text-shadow: 0 0 4px rgb(166 230 255 / .35);
}
.link-row input::placeholder { color: var(--vfd-dim); text-shadow: none; opacity: 1; }
.link-row input:disabled { opacity: .7; }
.clear {
  display: none; flex: none;
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid rgb(166 230 255 / .3);
  background: none; color: var(--vfd); cursor: pointer;
  align-items: center; justify-content: center;
  --icon: 14px;
}
.clear.show { display: inline-flex; }
.clear:hover { background: rgb(166 230 255 / .1); }

.status { min-height: 16px; }
.status.warn { color: var(--vfd-warn); text-shadow: 0 0 6px rgb(255 187 85 / .4); }

.video { display: flex; gap: 14px; align-items: flex-start; }
.video[hidden] { display: none; }
.thumb {
  width: 132px; aspect-ratio: 16 / 9; flex: none; object-fit: cover;
  border-radius: 3px;
  background: rgb(166 230 255 / .06);
  filter: saturate(.85) brightness(.92);
  box-shadow: 0 0 0 1px rgb(166 230 255 / .18);
}
.video .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.video .title { font: 700 16px/1.3 Lato, sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
.video .sub { font-size: 13px; color: var(--vfd-dim); }
.video .lic { font-size: 11px; color: var(--vfd-dim); }
.video.loading .title, .video.loading .sub { color: transparent; text-shadow: none; background: rgb(166 230 255 / .08); border-radius: 3px; }
.video.loading .title { width: 70%; height: 20px; }
.video.loading .sub { width: 40%; height: 14px; }
.video.loading .thumb { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }

.readout { margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 10px; border-top: 1px solid rgb(166 230 255 / .12); }
.readout[hidden] { display: none; }
.readout .seg { font-size: 26px; }

/* level meter + readouts */
.run { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.run[hidden] { display: none; }
.run-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.readouts { display: flex; align-items: baseline; gap: 16px; }
.seg { position: relative; font: 700 22px/1 Seg, monospace; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.seg .ghost { position: absolute; inset: 0; color: var(--vfd-ghost); text-shadow: none; }
.seg .val { position: relative; }
.seg-unit { font-size: 10px; letter-spacing: .14em; color: var(--vfd-dim); font-weight: 700; margin-left: 4px; }
.meter { display: grid; grid-template-columns: repeat(32, 1fr); gap: 3px; height: 12px; }
.meter i { display: block; border-radius: 1px; background: var(--vfd-ghost); }
.meter i.lit { background: var(--vfd); box-shadow: 0 0 6px rgb(166 230 255 / .55); }
.meter.sweep i { animation: sweep 1.3s steps(1) infinite; animation-delay: calc(var(--n) * 40ms); }
@keyframes sweep { 0%, 12% { background: var(--vfd); box-shadow: 0 0 6px rgb(166 230 255 / .55); } 13%, 100% { background: var(--vfd-ghost); box-shadow: none; } }

/* saved files */
.files { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.files[hidden] { display: none; }
.files li { display: flex; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid rgb(166 230 255 / .14); }
.files .f-tag { font: 700 11px/1 Lato, sans-serif; letter-spacing: .12em; padding: 4px 6px; border-radius: 3px; border: 1px solid currentColor; flex: none; }
.files .f-meta { flex: 1; min-width: 0; }
.files .f-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .f-sub { font-size: 11px; color: var(--vfd-dim); letter-spacing: .04em; }
.eject {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px; border-radius: 5px;
  border: 1px solid rgb(166 230 255 / .35); background: rgb(166 230 255 / .06);
  color: var(--vfd); font: 700 11px/1 Lato, sans-serif; letter-spacing: .12em; text-transform: uppercase;
  cursor: pointer; --icon: 13px;
}
.eject:hover { background: rgb(166 230 255 / .14); }

.err { margin-top: auto; display: flex; gap: 10px; align-items: flex-start; color: var(--vfd-warn); text-shadow: 0 0 6px rgb(255 187 85 / .35); }
.err[hidden] { display: none; }
.err .icon { --icon: 18px; margin-top: 1px; }
.err strong { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.err p { margin: 2px 0 0; word-break: break-word; }

/* ---------- Keys ---------- */
.key {
  position: relative;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-width: 64px; height: 56px; padding: 0 14px;
  border: 0; border-radius: 6px;
  background: linear-gradient(180deg, var(--key-top), var(--key-bot));
  color: var(--key-text);
  font: 700 13px/1 Lato, sans-serif; letter-spacing: .06em;
  box-shadow:
    inset 0 1px 0 var(--key-shine),
    inset 0 -2px 0 rgb(0 0 0 / .06),
    0 0 0 1px var(--key-edge),
    0 2px 0 rgb(0 0 0 / .22),
    0 4px 6px -2px var(--key-drop);
  transform: translateY(0);
  transition: transform 90ms steps(2), box-shadow 90ms steps(2);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.key:hover { background: linear-gradient(180deg, var(--key-top), var(--key-top) 40%, var(--key-bot)); }
.key:active, .key[aria-pressed="true"], .key[aria-checked="true"] {
  transform: translateY(2px);
  background: linear-gradient(180deg, var(--key-down-top), var(--key-down-bot));
  box-shadow:
    inset 0 1px 2px rgb(0 0 0 / .14),
    0 0 0 1px var(--key-edge),
    0 1px 0 rgb(0 0 0 / .2);
}
.key:disabled { cursor: default; opacity: .45; }
.key:disabled:active { transform: none; }
.key .led { width: 14px; height: 4px; border-radius: 2px; }
:is(.key, .clear, .eject):focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.link-row:focus-within { border-bottom-color: var(--vfd); box-shadow: 0 1px 0 var(--vfd); }
.window:has(#url:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }

/* transport: LED-ring knob. The ring is the indicator and the progress meter. */
.transport { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.dial { --size: 156px; --r: 66px; --seg-h: 11px; position: relative; width: var(--size); height: var(--size); flex: none; }
.ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: var(--well);
  box-shadow: inset 0 1px 3px rgb(0 0 0 / .28), 0 1px 0 var(--engrave-hi);
}
.ring i {
  position: absolute; left: 50%; top: 50%;
  width: 4px; height: var(--seg-h); margin: calc(var(--seg-h) / -2) 0 0 -2px; border-radius: 2px;
  background: var(--led-off); opacity: .6;
  transform: rotate(calc(var(--n) * 15deg)) translateY(calc(var(--r) * -1));
}
.ring i.lit { background: var(--led-on); opacity: 1; box-shadow: 0 0 6px var(--led-glow); }
/* At rest the ring is one continuous blue line; segments appear only while converting. */
.ring::before {
  content: ""; position: absolute; border-radius: 50%;
  inset: calc(var(--size) / 2 - var(--r) - 2px);
  border: 3px solid transparent;
}
.dial.ready .ring::before { border-color: var(--led-on); box-shadow: 0 0 8px var(--led-glow), inset 0 0 6px var(--led-glow); }
.dial.done .ring::before { border-color: var(--led-ok); box-shadow: 0 0 8px var(--led-ok-glow), inset 0 0 6px var(--led-ok-glow); }
.dial.busy .ring::before, .dial:not(.busy) .ring i { display: none; }
.dial.sweep .ring i { animation: ring-sweep 1.2s steps(1) infinite; animation-delay: calc(var(--n) * 50ms); }
@keyframes ring-sweep { 0%, 8% { background: var(--led-on); opacity: 1; box-shadow: 0 0 6px var(--led-glow); } 9%, 100% { background: var(--led-off); opacity: .6; box-shadow: none; } }
.knob {
  position: absolute; inset: calc(var(--size) * .135); border-radius: 50%; border: 0; padding: 0;
  display: grid; place-items: center; cursor: pointer; --icon: 30px;
  background:
    repeating-radial-gradient(circle at 50% 50%, transparent 0 1px, var(--hairline) 1px 2px),
    radial-gradient(circle at 50% 28%, var(--key-top), var(--key-bot) 72%);
  box-shadow:
    inset 0 1px 0 var(--key-shine),
    inset 0 -2px 0 rgb(0 0 0 / .06),
    0 0 0 1px var(--key-edge),
    0 3px 0 rgb(0 0 0 / .2),
    0 8px 14px -4px var(--key-drop);
  transition: transform 90ms steps(2), box-shadow 90ms steps(2);
  -webkit-tap-highlight-color: transparent;
}
.knob:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: inset 0 2px 3px rgb(0 0 0 / .14), 0 0 0 1px var(--key-edge), 0 1px 0 rgb(0 0 0 / .2);
}
.knob:disabled { cursor: default; }
.knob:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
/* drop-shadow sits on the wrapper because the icon itself is masked */
.glyph { display: inline-flex; color: var(--led-off); }
.dial.ready .glyph, .dial.busy .glyph { color: var(--led-on); filter: drop-shadow(0 0 2px var(--led-glow)) drop-shadow(0 0 7px var(--led-glow)); }
/* Done: the icon becomes a check glowing green until the next lookup or conversion. */
.dial.done .glyph { color: var(--led-ok); filter: drop-shadow(0 0 2px var(--led-ok-glow)) drop-shadow(0 0 7px var(--led-ok-glow)); }
.dial.done .glyph .icon { --src: url(icons/check.svg); }
.transport .legend { letter-spacing: .2em; }
@keyframes blink { 50% { opacity: .25; } }
.dest { font-size: 12px; color: var(--engrave-soft); text-shadow: 0 1px 0 var(--engrave-hi); }

/* key bank */
.bank {
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid rgb(0 0 0 / .14);
  box-shadow: inset 0 1px 0 var(--engrave-hi);
  display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-end;
}
.group[hidden] { display: none; }
.group { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; border: 0; min-width: 0; }
.group.off .keys { opacity: .7; }
.group.off .key > .led { background: var(--led-off); box-shadow: inset 0 1px 1px rgb(0 0 0 / .45); }
.keys {
  display: flex; gap: 6px; padding: 5px; border-radius: 9px;
  background: var(--well);
  box-shadow: inset 0 1px 3px rgb(0 0 0 / .28), 0 1px 0 var(--engrave-hi);
}
.keys .key { height: 52px; }
.bank-foot { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; }
.hint:empty { display: none; }
.hint { font-size: 12px; color: var(--engrave-soft); text-shadow: 0 1px 0 var(--engrave-hi); }

.foot { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--engrave); }

@media (max-width: 760px) {
  body { padding: 20px 12px; align-items: start; }
  .unit { padding: 14px 14px 16px; }
  .top .model { display: none; }
  .deck { grid-template-columns: 1fr; gap: 14px; }
  .vfd { min-height: 0; }
  .thumb { width: 104px; }
  .transport { flex-direction: row; gap: 18px; }
  .dial { --size: 112px; --r: 47px; --seg-h: 8px; }
  .knob { --icon: 24px; }
  .bank { gap: 16px; }
  .group, .keys { width: 100%; }
  .keys .key { flex: 1 1 0; min-width: 0; padding: 0 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .key, .knob { transition: none; }
  .meter.sweep i, .dial.sweep .ring i, .video.loading .thumb { animation: none; }
  .meter.sweep i { background: rgb(166 230 255 / .35); }
}
</style>
</head>
<body>
<main class="rack">
  <div class="unit">
    <header class="top">
      <span class="led on" aria-hidden="true"></span>
      <h1 class="brand" style="margin:0;font:inherit">YouTube Converter</h1>
      <span class="model">MP3 · MP4 · Local</span>
    </header>

    <div class="deck">
      <div class="window">
        <section class="vfd" aria-label="Display">
          <form class="link-row" id="field" autocomplete="off">
            <label for="url" class="vfd-small">Link</label>
            <input id="url" name="url" type="url" inputmode="url" spellcheck="false"
                   placeholder="Paste a YouTube link" aria-describedby="status">
            <button type="button" class="clear" id="clear" aria-label="Clear and start over"><span class="icon i-x"></span></button>
          </form>

          <div class="status vfd-small" id="status" aria-live="polite">Paste a link and press Return</div>

          <div class="video glow" id="preview" hidden>
            <img class="thumb" id="thumb" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
            <div class="meta">
              <div class="title" id="title">&nbsp;</div>
              <div class="sub" id="sub">&nbsp;</div>
              <div class="lic" id="lic"></div>
            </div>
          </div>

          <div class="readout" id="readout" aria-hidden="true">
            <span class="seg glow"><span class="ghost" id="r-ghost">88:88</span><span class="val" id="r-dur">--:--</span></span>
            <span class="vfd-small glow" id="r-out"></span>
          </div>

          <div class="run" id="progress" hidden aria-live="polite">
            <div class="run-head">
              <span class="vfd-small" id="p-label">Starting</span>
              <span class="readouts glow">
                <span aria-hidden="true"><span class="seg"><span class="ghost">888</span><span class="val" id="p-pct">!!0</span></span><span class="seg-unit">%</span></span>
                <span class="vfd-small" id="p-speed"></span>
                <span class="seg" aria-hidden="true"><span class="ghost">88:88</span><span class="val" id="p-eta">--:--</span></span>
              </span>
            </div>
            <div class="meter" id="meter" role="progressbar" aria-labelledby="p-label" aria-valuemin="0" aria-valuemax="100"></div>
          </div>

          <ul class="files glow" id="files" hidden aria-label="Saved files"></ul>

          <div class="err" id="error" hidden role="alert">
            <span class="icon i-alert" aria-hidden="true"></span>
            <div><strong>Couldn't convert</strong><p id="error-msg"></p></div>
          </div>
        </section>
      </div>

      <div class="transport">
        <div class="dial" id="dial">
          <div class="ring" id="ring" aria-hidden="true"></div>
          <button class="knob" id="convert" disabled aria-labelledby="convert-label">
            <span class="glyph" aria-hidden="true"><span class="icon i-download"></span></span>
          </button>
        </div>
        <span class="legend" id="convert-label">Convert</span>
      </div>
    </div>

    <div class="bank">
      <div class="group" role="group" aria-labelledby="fmt-label">
        <span class="legend" id="fmt-label">Format</span>
        <div class="keys" id="formats">
          <button type="button" class="key" aria-pressed="true" data-value="mp3"><span class="led" aria-hidden="true"></span>MP3</button>
          <button type="button" class="key" aria-pressed="false" data-value="mp4"><span class="led" aria-hidden="true"></span>MP4</button>
        </div>
      </div>
      <div class="group" id="q-mp3">
        <span class="legend" id="q-mp3-label">MP3 · kbps</span>
        <div class="keys" role="radiogroup" aria-labelledby="q-mp3-label"></div>
      </div>
      <div class="group" id="q-mp4" hidden>
        <span class="legend" id="q-mp4-label">MP4 · Resolution</span>
        <div class="keys" role="radiogroup" aria-labelledby="q-mp4-label"></div>
      </div>
      <div class="bank-foot">
        <span class="hint" id="hint"></span>
        <span class="dest" id="dest"></span>
      </div>
    </div>
  </div>
  <p class="foot">Only download videos you own or have permission to use, such as Creative Commons content.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MP3 = [["128", "128"], ["192", "192"], ["320", "320"]];
const SEGMENTS = 32;
const state = { done: false, info: null, formats: new Set(["mp3"]), quality: { mp3: "192", mp4: "1080" }, busy: false, infoReq: 0 };

const RING = 24;
$("ring").replaceChildren(...Array.from({ length: RING }, (_, n) => {
  const i = document.createElement("i"); i.style.setProperty("--n", n); return i;
}));
$("meter").replaceChildren(...Array.from({ length: SEGMENTS }, (_, n) => {
  const i = document.createElement("i"); i.style.setProperty("--n", n); return i;
}));

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({ error: "The server didn't respond properly." }));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function fmtDuration(s) {
  if (s == null) return "";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(Math.floor(s % 60)).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}
function fmtBytes(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i ? 1 : 0)} ${u[i]}`;
}

function setStatus(msg, warn = false) {
  $("status").textContent = msg;
  $("status").classList.toggle("warn", warn);
  $("url").setAttribute("aria-invalid", warn ? "true" : "false");
}

function renderRadioKeys(el, options, selected, disabled, onPick) {
  el.replaceChildren(...options.map(([value, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "key"; b.setAttribute("role", "radio"); b.dataset.value = value;
    const led = document.createElement("span"); led.className = "led"; led.setAttribute("aria-hidden", "true");
    b.append(led, label);
    b.setAttribute("aria-checked", String(value === selected));
    b.tabIndex = value === selected ? 0 : -1;
    b.disabled = disabled;
    b.onclick = () => onPick(value);
    return b;
  }));
}

document.addEventListener("keydown", (e) => {
  const group = e.target.closest?.('[role="radiogroup"]');
  if (!group || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const items = [...group.querySelectorAll('[role="radio"]')];
  const i = items.indexOf(e.target) + (e.key === "ArrowRight" ? 1 : -1);
  const next = items[(i + items.length) % items.length];
  next.click(); group.querySelector(`[data-value="${next.dataset.value}"]`)?.focus();
});

function defaultHeight() {
  const hs = state.info?.heights || [];
  return String(hs.find((h) => h <= 1080) || hs[hs.length - 1] || 1080);
}

function renderControls() {
  for (const b of $("formats").querySelectorAll(".key")) {
    const on = state.formats.has(b.dataset.value);
    b.setAttribute("aria-pressed", String(on));
    b.disabled = state.busy;
    // The last latched format can't be released; it stays visibly on.
    b.title = on && state.formats.size === 1 ? "At least one format stays on" : "";
  }
  const mp3On = state.formats.has("mp3"), mp4On = state.formats.has("mp4");
  $("q-mp3").classList.toggle("off", !mp3On);
  $("q-mp4").hidden = !mp4On;

  // Presets stay live: pressing one in a switched-off group also latches that format.
  renderRadioKeys($("q-mp3").querySelector(".keys"), MP3, state.quality.mp3, state.busy,
    (v) => { state.formats.add("mp3"); state.quality.mp3 = v; renderControls(); });

  const heights = (state.info?.heights?.length ? state.info.heights : [1080, 720, 480, 360]).filter((h) => h >= 360).slice(0, 5).reverse();
  if (!heights.includes(Number(state.quality.mp4))) state.quality.mp4 = defaultHeight();
  renderRadioKeys($("q-mp4").querySelector(".keys"), heights.map((h) => [String(h), h >= 2160 ? "4K" : `${h}p`]),
    state.quality.mp4, state.busy, (v) => { state.formats.add("mp4"); state.quality.mp4 = v; renderControls(); });

  const outs = [...state.formats].sort().map((f) => f === "mp3" ? `MP3 ${state.quality.mp3}` : `MP4 ${state.quality.mp4 >= 2160 ? "4K" : state.quality.mp4 + "P"}`);
  $("r-out").textContent = outs.join(" + ");

  const hints = [];
  if (mp3On) hints.push(state.quality.mp3 === "320" ? "YouTube audio is about 130–160 kbps, so 320 makes a bigger file, not a better one." : "");
  if (mp4On) hints.push(Number(state.quality.mp4) > 1080 ? "Above 1080p YouTube only has VP9/AV1 video, which QuickTime can't open." : "MP4 up to 1080p is H.264 + AAC and plays everywhere.");
  $("hint").textContent = hints.filter(Boolean).join(" ");

  const folders = [...state.formats].sort().map((f) => f.toUpperCase()).join(" + ");
  $("dest").textContent = `Saves to Downloads › YouTube Converter › ${folders}`;
  const btn = $("convert");
  btn.disabled = !state.info || state.busy;
  $("dial").classList.toggle("ready", !!state.info && !state.busy);
  $("dial").classList.toggle("busy", state.busy);
  $("dial").classList.toggle("done", state.done && !state.busy);
  if (!state.busy) { $("dial").classList.remove("sweep"); setRing(0); }
  $("convert-label").textContent = state.busy ? "Working" : "Convert";
}

$("formats").addEventListener("click", (e) => {
  const b = e.target.closest(".key");
  if (!b || b.disabled) return;
  const f = b.dataset.value;
  if (state.formats.has(f)) { if (state.formats.size > 1) state.formats.delete(f); } else state.formats.add(f);
  renderControls();
});

function resetOutput() {
  state.done = false;
  $("error").hidden = true; $("files").hidden = true; $("progress").hidden = true;
  $("readout").hidden = false;
}

function setDuration(s) {
  const long = s != null && s >= 3600;
  $("r-ghost").textContent = long ? "8:88:88" : "88:88";
  $("r-dur").textContent = s == null ? "--:--" : (long ? fmtDuration(s) : fmtDuration(s).padStart(5, "0"));
}

async function loadInfo() {
  const url = $("url").value.trim();
  if (!url) { state.info = null; $("preview").hidden = true; setStatus("Paste a link and press Return"); renderControls(); return; }
  if (state.info && state.info._input === url) return;

  resetOutput();
  const req = ++state.infoReq;
  state.info = null;
  renderControls();
  $("preview").hidden = false;
  $("preview").classList.add("loading");
  $("thumb").src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  setStatus("Looking up video…");
  try {
    const info = await api("/api/info", { url });
    if (req !== state.infoReq) return;
    info._input = url;
    state.info = info;
    $("thumb").src = info.thumbnail || "";
    $("title").textContent = info.title;
    $("sub").textContent = [info.channel, fmtDuration(info.duration)].filter(Boolean).join(" · ");
    $("lic").textContent = info.license || "";
    $("preview").classList.remove("loading");
    setDuration(info.duration);
    setStatus("Ready");
    state.quality.mp4 = defaultHeight();
  } catch (err) {
    if (req !== state.infoReq) return;
    $("preview").hidden = true;
    setDuration(null);
    setStatus(err.message, true);
  }
  renderControls();
}

function showProgress(job) {
  const p = job.percent || 0;
  const fmt = (job.current || "").toUpperCase();
  const prefix = job.tasks > 1 ? `${fmt} ${job.task}/${job.tasks} · ` : (fmt ? `${fmt} · ` : "");
  const labels = {
    queued: "Starting",
    downloading: job.streams > 1 ? `Downloading ${job.stream === 1 ? "video" : "audio"}` : "Downloading audio",
    converting: "Encoding MP3",
    merging: "Joining video + audio",
  };
  $("p-label").textContent = prefix + (labels[job.phase] || "Working");
  const indeterminate = ["queued", "converting", "merging"].includes(job.phase);
  $("p-pct").textContent = String(Math.round(p)).padStart(3, "!"); // "!" is DSEG's blank digit
  $("p-speed").textContent = job.phase === "downloading" && job.speed ? `${fmtBytes(job.speed)}/s` : "";
  const eta = job.phase === "downloading" && job.eta != null ? job.eta : null;
  $("p-eta").textContent = eta == null ? "--:--" : `${String(Math.floor(eta / 60)).padStart(2, "0")}:${String(eta % 60).padStart(2, "0")}`;
  const meter = $("meter");
  meter.classList.toggle("sweep", indeterminate);
  const lit = indeterminate ? 0 : Math.round((p / 100) * SEGMENTS);
  [...meter.children].forEach((s, i) => s.classList.toggle("lit", i < lit));
  meter.setAttribute("aria-valuenow", String(Math.round(p)));

  // The knob's ring shows the whole job (all formats), not just the current one.
  $("dial").classList.toggle("sweep", indeterminate);
  const tasks = job.tasks || 1, task = job.task || 1;
  setRing(indeterminate ? 0 : ((task - 1) + p / 100) / tasks);
}

function setRing(fraction) {
  const lit = Math.round(fraction * RING);
  [...$("ring").children].forEach((s, i) => s.classList.toggle("lit", i < lit));
}

function setBusy(busy) {
  state.busy = busy;
  $("url").disabled = busy;
  $("clear").disabled = busy;
  renderControls();
}

function renderFiles(jobId, files) {
  $("files").replaceChildren(...files.map((f, i) => {
    const li = document.createElement("li");
    const tag = document.createElement("span"); tag.className = "f-tag"; tag.textContent = f.format.toUpperCase();
    const meta = document.createElement("div"); meta.className = "f-meta";
    const name = document.createElement("div"); name.className = "f-name"; name.textContent = f.name; name.title = f.name;
    const sub = document.createElement("div"); sub.className = "f-sub"; sub.textContent = `Saved · ${f.folder} · ${fmtBytes(f.size)}`;
    meta.append(name, sub);
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "eject";
    btn.innerHTML = '<span class="icon i-eject" aria-hidden="true"></span>Show in Finder';
    btn.setAttribute("aria-label", `Show ${f.format.toUpperCase()} file in Finder`);
    btn.onclick = () => api(`/api/jobs/${jobId}/reveal/${i}`, {}).catch((err) => { sub.textContent = err.message; });
    li.append(tag, meta, btn);
    return li;
  }));
  $("files").hidden = false;
}

async function convert() {
  if (!state.info || state.busy) return;
  resetOutput();
  setBusy(true);
  $("readout").hidden = true;
  $("progress").hidden = false;
  setStatus("Converting");
  showProgress({ phase: "queued" });
  let id, job;
  try {
    const outputs = [...state.formats].map((f) => ({ format: f, quality: state.quality[f] }));
    ({ id } = await api("/api/jobs", { url: state.info.url, outputs }));
    do {
      await new Promise((r) => setTimeout(r, 600));
      job = await api(`/api/jobs/${id}`);
      showProgress(job);
    } while (job.phase !== "done" && job.phase !== "error");
    if (job.phase === "error") throw new Error(job.error);
    setStatus(job.files.length > 1 ? "Both files saved" : "Saved");
    state.done = true;
  } catch (err) {
    $("error-msg").textContent = job?.files?.length
      ? `${err.message} (${job.files.map((f) => f.format.toUpperCase()).join(", ")} was saved.)`
      : err.message;
    $("error").hidden = false;
    setStatus("Stopped", true);
  } finally {
    $("progress").hidden = true;
    if (job?.files?.length) renderFiles(id, job.files);
    $("readout").hidden = !$("files").hidden || !$("error").hidden;
    setBusy(false);
  }
}

$("field").addEventListener("submit", (e) => { e.preventDefault(); loadInfo(); });
$("url").addEventListener("paste", () => setTimeout(loadInfo, 0));
$("url").addEventListener("blur", loadInfo);
$("url").addEventListener("input", () => {
  $("clear").classList.toggle("show", !!$("url").value);
  if ($("status").classList.contains("warn")) setStatus("Press Return to look it up");
});
$("clear").addEventListener("click", () => {
  $("url").value = ""; $("clear").classList.remove("show");
  resetOutput(); state.info = null; $("preview").hidden = true; setDuration(null);
  setStatus("Paste a link and press Return"); renderControls(); $("url").focus();
});
$("convert").addEventListener("click", convert);

renderControls();
</script>
</body>
</html>
